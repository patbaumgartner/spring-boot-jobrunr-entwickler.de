name: invoicing
services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: invoicing-local
      POSTGRES_DB: invoicing
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicing -d invoicing"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    # Behind a profile, so Spring Boot's Docker Compose support starts PostgreSQL but not
    # a second copy of the application.
    profiles: ["packaged"]
    image: invoicing:1.0.0-SNAPSHOT
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/invoicing
      INVOICING_PORTAL_URL: http://localhost:8080
      INVOICING_DATA_DIRECTORY: /home/cnb/artifacts
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8000:8000"]
    volumes: ["artifacts:/home/cnb"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres-data:
  artifacts:
