spring.application.name=invoicing

# Local demo: listen on all interfaces so it is reachable from Windows through WSL.
server.address=0.0.0.0
server.port=8080
server.shutdown=graceful

# Errors are answered as RFC 9457 problem details.
spring.mvc.problemdetails.enabled=true

# PostgreSQL holds the invoice runs and the JobRunr jobs.
spring.datasource.url=jdbc:postgresql://localhost:5432/invoicing
spring.datasource.username=invoicing
spring.datasource.password=invoicing-local
spring.sql.init.mode=always
spring.docker.compose.lifecycle-management=start-and-stop

# JobRunr OSS: worker and dashboard are opt-in.
jobrunr.background-job-server.enabled=true
jobrunr.background-job-server.worker-count=2
jobrunr.background-job-server.poll-interval-in-seconds=5
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8000
jobrunr.dashboard.username=invoicing
jobrunr.dashboard.password=invoicing-local
# A short back-off keeps the retry visible in the demo; the default seed is 3.
jobrunr.jobs.retry-back-off-time-seed=2
# Retention properties since JobRunr 8.8.1.
jobrunr.jobs.delete-succeeded-jobs-after=36h
jobrunr.jobs.permanently-delete-deleted-jobs-after=72h
jobrunr.miscellaneous.allow-anonymous-data-usage=false

# Artifacts have to survive a restart just like the database.
invoicing.data-directory=./data
invoicing.portal-url=http://localhost:8080
invoicing.http-timeout=2s
# Longer than JobRunr keeps a succeeded job (36h + 72h), so a job that is requeued in the dashboard still finds its files.
invoicing.retention=7d

# Store the package, then delay the first response to demonstrate a timeout retry.
portal.delay-first-response=5s
